# Builds Marsam for Windows, macOS and Linux plus an offline web zip.
# Runs only when started by hand (Actions → Build & Release → Run workflow), so it never
# collides with releases uploaded manually. Run on a branch to get the files as downloadable
# build artifacts; run on a tag like v1.0.1 to also attach them to that tag's release.
name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win nsis portable --x64
          - name: macOS
            os: macos-latest
            args: --mac dmg zip --arm64 --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke test
        if: runner.os == 'Windows'
        run: npm test
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: marsam-${{ runner.os }}
          if-no-files-found: error
          # latest*.yml and *.blockmap are what installed copies read to update themselves.
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  web:
    name: Offline web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Zip app folder
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cd app && zip -r "../dist/Marsam-${VERSION}-web-offline.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: marsam-web
          if-no-files-found: error
          path: dist/*.zip

  release:
    name: Publish release
    needs: [desktop, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
